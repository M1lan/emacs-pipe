name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup component add rustfmt clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Unit tests
        run: cargo test --release --verbose
      - name: Build release
        run: cargo build --release --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: epipe-linux-x86_64
          path: target/release/epipe

  bash:
    name: bash (shellcheck + bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats + shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck
      - name: Shellcheck
        run: shellcheck bash/epipe.bash tests/fixtures/fake-emacsclient.bash tests/fixtures/helpers.bash
      - name: Make scripts executable
        run: chmod +x bash/epipe.bash tests/fixtures/fake-emacsclient.bash
      - name: Bats parity (bash impl)
        run: EPIPE_BIN="$PWD/bash/epipe.bash" bats tests/shared.bats

  parity:
    name: parity (rust impl vs bats)
    runs-on: ubuntu-latest
    needs: [rust, bash]
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
      - name: Build rust binary
        run: cargo build --release
      - name: Make scripts executable
        run: chmod +x tests/fixtures/fake-emacsclient.bash
      - name: Bats parity (rust impl)
        run: EPIPE_BIN="$PWD/target/release/epipe" bats tests/shared.bats
